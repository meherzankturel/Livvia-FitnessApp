<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #050508; }
  :root { --earth: #2D2A24; --sand: #F6F5F0; --trail: #34D399; --rock: #8E8E7A; --stone: #EDEBE5; }

  .grid { display: grid; grid-template-columns: repeat(3, 393px); gap: 16px; padding: 8px 10px 60px; justify-content: center; }
  @media (max-width: 1250px) { .grid { grid-template-columns: repeat(2, 393px); } }
  @media (max-width: 830px) { .grid { grid-template-columns: 393px; } }

  .col-label { text-align: center; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #888; padding: 4px 0 2px; }
  .col-desc { text-align: center; font-size: 8px; color: #555; padding: 0 6px 4px; line-height: 1.3; max-width: 393px; margin: 0 auto; }

  .phone { width: 393px; height: 852px; border-radius: 48px; overflow: hidden; position: relative; border: 2.5px solid rgba(255,255,255,0.06); background: var(--sand); }
  .ps { width: 100%; height: 100%; overflow-y: auto; scrollbar-width: none; overflow-x: hidden; }
  .ps::-webkit-scrollbar { display: none; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  .ph { padding: 20px 24px 0; }
  .ph-head { display: flex; justify-content: space-between; margin-bottom: 10px; }
  .ph-title { font-size: 14px; font-weight: 700; color: var(--earth); }
  .ph-sub { font-size: 11px; color: var(--rock); }
  .ph-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid rgba(0,0,0,0.04); }
  .ph-cb { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--stone); flex-shrink: 0; }
  .ph-bar { height: 12px; border-radius: 6px; background: var(--stone); flex: 1; opacity: 0.35; }
  .ph-sm { width: 40px; height: 10px; border-radius: 5px; background: var(--stone); opacity: 0.25; }

  .back { width: 32px; height: 32px; border-radius: 16px; background: var(--stone); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .pill { padding: 5px 12px; border-radius: 100px; background: var(--stone); font-size: 11px; font-weight: 600; color: var(--earth); }
  .video-pill { padding: 5px 14px; border-radius: 100px; background: var(--earth); font-size: 11px; font-weight: 600; color: var(--trail); cursor: pointer; }

  .v1-top { padding: 56px 24px 0; display: flex; align-items: center; }
  .v1-type { font-size: 10px; font-weight: 600; color: var(--rock); text-transform: uppercase; letter-spacing: 1.2px; margin-left: auto; }
  .v1-anim { display: flex; justify-content: center; }
  .v1-anim-box { width: 260px; height: 230px; }
  .v1-name { padding: 0 24px; font-size: 30px; font-weight: 800; color: var(--earth); letter-spacing: -1.2px; line-height: 1.05; text-align: center; animation: fadeUp 0.4s ease-out 0.2s backwards; margin-top: -16px; }
  .v1-meta { display: flex; justify-content: center; gap: 8px; padding: 10px 24px 0; animation: fadeUp 0.35s ease-out 0.3s backwards; }

  .v2-top { padding: 56px 24px 0; display: flex; align-items: center; }
  .v2-type { font-size: 10px; font-weight: 600; color: var(--rock); text-transform: uppercase; letter-spacing: 1.2px; margin-left: auto; }
  .v2-hero { display: flex; align-items: center; padding: 0 10px; animation: fadeUp 0.4s ease-out; }
  .v2-anim-box { width: 180px; height: 160px; flex-shrink: 0; }
  .v2-info { flex: 1; padding-left: 6px; }
  .v2-name { font-size: 28px; font-weight: 800; color: var(--earth); letter-spacing: -1px; line-height: 1.05; }
  .v2-meta { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .v2-pill { padding: 4px 10px; border-radius: 8px; background: var(--stone); font-size: 10px; font-weight: 600; color: var(--earth); }
  .v2-video { padding: 4px 12px; border-radius: 8px; background: var(--earth); font-size: 10px; font-weight: 600; color: var(--trail); cursor: pointer; }

  .v3-top { padding: 56px 24px 0; display: flex; align-items: center; }
  .v3-type { font-size: 10px; font-weight: 600; color: var(--rock); text-transform: uppercase; letter-spacing: 1.2px; margin-left: auto; }
  .v3-hero { position: relative; padding: 0 24px; margin-top: 4px; min-height: 180px; }
  .v3-anim-float { position: absolute; right: 6px; top: -30px; z-index: 2; }
  .v3-anim-box { width: 200px; height: 180px; }
  .v3-name { font-size: 32px; font-weight: 800; color: var(--earth); letter-spacing: -1.3px; line-height: 1.05; padding-right: 120px; padding-top: 16px; animation: fadeUp 0.4s ease-out; position: relative; z-index: 1; }
  .v3-meta { display: flex; gap: 8px; padding: 6px 0 0; flex-wrap: wrap; animation: fadeUp 0.35s ease-out 0.15s backwards; }
</style>
</head>

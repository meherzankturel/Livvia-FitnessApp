<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repped — Locked Hero N5</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#050508;display:flex;justify-content:center;padding:20px 10px 60px}
:root{--earth:#2D2A24;--sand:#F6F5F0;--trail:#34D399;--rock:#8E8E7A;--stone:#EDEBE5}
.phone{width:393px;height:852px;border-radius:48px;overflow:hidden;position:relative;border:2.5px solid rgba(255,255,255,0.06);background:var(--sand)}
.ps{width:100%;height:100%;overflow-y:auto;scrollbar-width:none;overflow-x:hidden}
.ps::-webkit-scrollbar{display:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.top{padding:56px 24px 0;display:flex;align-items:center;position:relative}
.back{width:32px;height:32px;border-radius:16px;background:var(--stone);display:flex;align-items:center;justify-content:center;cursor:pointer;position:absolute;left:24px;z-index:2}
.type{font-size:12px;font-weight:600;color:var(--rock);text-transform:uppercase;letter-spacing:1.5px;text-align:center;width:100%}
.anim-wrap{display:flex;justify-content:center;margin-top:-4px}
.anim-box{width:260px;height:230px}
.name{padding:0 20px;font-size:32px;font-weight:800;color:var(--earth);letter-spacing:-1.5px;line-height:1;text-align:center;margin-top:-16px;animation:fadeUp .4s ease-out .2s backwards}
.sub{text-align:center;padding:6px 24px 0;font-size:12px;color:var(--rock);animation:fadeUp .35s ease-out .3s backwards}
.sub strong{color:var(--earth);font-weight:700}
.video-wrap{display:flex;justify-content:center;padding:8px 0 0;animation:fadeUp .35s ease-out .35s backwards}
.video-pill{padding:5px 14px;border-radius:100px;background:var(--earth);font-size:11px;font-weight:600;color:var(--trail);cursor:pointer}
.locked{text-align:center;padding:24px 0;font-size:8px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:1.5px}
</style>
</head>
<body>
<div class="phone"><div class="ps">
  <div class="top">
    <div class="back"><span style="font-size:18px;color:var(--earth);margin-top:-1px">‹</span></div>
    <span class="type">Breakfast · Recipe</span>
  </div>
  <div class="anim-wrap"><div id="lottie-hero" class="anim-box"></div></div>
  <div class="name">Black Bean Burrito Bowl</div>
  <div class="sub"><strong>5</strong> min prep · <strong>10</strong> min cook · <strong>Easy</strong></div>
  <div class="video-wrap"><span class="video-pill">▶ Watch Video</span></div>
  <div class="locked">— Locked Hero (N5 + Pan Animation) —</div>
</div></div>
<script>
lottie.loadAnimation({
  container: document.getElementById('lottie-hero'),
  renderer: 'svg',
  loop: true,
  autoplay: true,
  path: '/cooking-pan.json'
});
</script>
</body>
</html>
